<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Deck Session Slot</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; margin: 8px; color: #e5e7eb; font-size: 12px; }
  label { display: block; margin-bottom: 4px; font-weight: 600; }
  select { width: 100%; padding: 4px; background: #1f2937; color: #e5e7eb; border: 1px solid #374151; border-radius: 4px; }
  .hint { margin-top: 6px; color: #9ca3af; }
</style>
</head>
<body>
<label for="session">Assigned session</label>
<select id="session" disabled><option>No active sessions</option></select>
<div class="hint">Choosing a session moves it to this key; occupants swap slots.</div>
<script>
"use strict";
const params = new URLSearchParams(window.location.search);
const port = params.get("port");
const uuid = params.get("propertyInspectorUUID");
const registerEvent = params.get("registerEvent");
const select = document.getElementById("session");
let socket;
let sessions = [];

function currentSlotIndex() {
  try {
    const info = JSON.parse(params.get("actionInfo") ?? "{}");
    return info.payload && info.payload.coordinates ? info.payload.coordinates.column : undefined;
  } catch {
    return undefined;
  }
}

function render() {
  const slot = currentSlotIndex();
  select.innerHTML = "";
  if (sessions.length === 0) {
    const empty = document.createElement("option");
    empty.textContent = "No active sessions";
    select.append(empty);
    select.disabled = true;
    return;
  }
  select.disabled = false;
  for (const session of sessions) {
    const option = document.createElement("option");
    option.value = session.sessionId;
    option.textContent = session.title + " · " + session.source + " · " + session.lifecycle;
    if (session.slotIndex === slot) option.selected = true;
    select.append(option);
  }
}

if (port && uuid && registerEvent) {
  socket = new WebSocket("ws://127.0.0.1:" + port);
  socket.onopen = () => socket.send(JSON.stringify({ event: registerEvent, uuid }));
  socket.onmessage = (message) => {
    let data;
    try { data = JSON.parse(message.data); } catch { return; }
    if (data.event === "sendToPropertyInspector" && data.payload && data.payload.type === "sessions") {
      sessions = Array.isArray(data.payload.sessions) ? data.payload.sessions : [];
      render();
    }
  };
}

select.addEventListener("change", () => {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify({
    event: "sendToPlugin",
    context: uuid,
    payload: { type: "set-slot-session", sessionId: select.value },
  }));
});
</script>
</body>
</html>
