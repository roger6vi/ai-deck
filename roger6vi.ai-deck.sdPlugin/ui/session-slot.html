<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Deck Session Slot</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; margin: 8px; color: #e5e7eb; font-size: 12px; }
  h1 { font-size: 12px; font-weight: 600; margin: 0 0 6px; }
  #sessions { display: flex; flex-direction: column; gap: 2px; }
  .row {
    display: flex; justify-content: space-between; gap: 8px; width: 100%;
    padding: 6px 8px; font: inherit; text-align: left; cursor: pointer;
    background: #1f2937; color: #e5e7eb; border: 1px solid #374151; border-radius: 4px;
  }
  .row:hover { background: #374151; }
  .row[aria-selected="true"] { background: #2563eb; border-color: #3b82f6; }
  .row .where { color: #9ca3af; white-space: nowrap; }
  .row[aria-selected="true"] .where { color: #dbeafe; }
  .empty { padding: 6px 8px; color: #9ca3af; }
  .hint { margin-top: 6px; color: #9ca3af; }
  .field { margin-top: 12px; }
  label { display: block; margin-bottom: 4px; font-weight: 600; }
  textarea { box-sizing: border-box; width: 100%; padding: 4px; resize: none; font: inherit; background: #1f2937; color: #e5e7eb; border: 1px solid #374151; border-radius: 4px; }
  #apply { margin-top: 6px; padding: 4px 12px; font: inherit; cursor: pointer; }
  #apply:disabled { cursor: default; }
</style>
</head>
<body>
<h1 id="sessions-label">Assigned session</h1>
<div id="sessions" role="listbox" aria-labelledby="sessions-label"></div>
<div class="hint">Choosing a session moves it to this key; the occupant takes its place. "None" frees the key and keeps the session selectable.</div>
<div class="field">
  <label for="name">Session name</label>
  <textarea id="name" rows="3" wrap="off" placeholder="No session on this key" disabled></textarea>
  <button id="apply" type="button" disabled>Apply</button>
  <div class="hint">Up to 3 lines of 10 characters; Enter adds a line. Apply an empty name to use the tmux window name.</div>
</div>
<script>
"use strict";
const list = document.getElementById("sessions");
const nameInput = document.getElementById("name");
const applyButton = document.getElementById("apply");
const NAME_MAX_LINES = 3;
const NAME_MAX_LINE_LENGTH = 10;
let socket;
let sessions = [];
let actionInfo;
let inspectorUUID;

function currentSlotIndex() {
  try {
    const info = typeof actionInfo === "string" ? JSON.parse(actionInfo) : actionInfo;
    return info && info.payload && info.payload.coordinates ? info.payload.coordinates.column : undefined;
  } catch {
    return undefined;
  }
}

function send(payload) {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify({ event: "sendToPlugin", context: inspectorUUID, payload }));
}

/**
 * A native dropdown popup is unreliable inside the Property Inspector webview
 * — it renders invisibly against the dark panel — so every choice is an
 * always-visible row instead.
 */
function addRow(label, where, selected, onPick) {
  const row = document.createElement("button");
  row.type = "button";
  row.className = "row";
  row.setAttribute("role", "option");
  row.setAttribute("aria-selected", selected ? "true" : "false");
  const name = document.createElement("span");
  name.textContent = label;
  const hint = document.createElement("span");
  hint.className = "where";
  hint.textContent = where;
  row.append(name, hint);
  row.addEventListener("click", onPick);
  list.append(row);
}

function renderName(slot) {
  const current = slot === undefined ? undefined : sessions.find((session) => session.slotIndex === slot);
  nameInput.disabled = current === undefined;
  applyButton.disabled = current === undefined;
  nameInput.placeholder = current === undefined ? "No session on this key" : "Window name";
  if (document.activeElement !== nameInput) nameInput.value = current && current.name ? current.name : "";
}

function render() {
  const slot = currentSlotIndex();
  renderName(slot);
  list.innerHTML = "";
  if (sessions.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No active sessions";
    list.append(empty);
    return;
  }
  const assigned = sessions.some((session) => session.slotIndex === slot);
  addRow("None", "free this key", !assigned, () => send({ type: "clear-slot" }));
  for (const session of sessions) {
    const where = session.slotIndex === undefined
      ? "unassigned"
      : session.slotIndex === slot ? "this key" : "key " + (session.slotIndex + 1);
    const label = session.title + " · " + session.source + " · " + session.lifecycle;
    addRow(label, where, session.slotIndex === slot, () => send({ type: "set-slot-session", sessionId: session.sessionId }));
  }
}

window.connectElgatoStreamDeckSocket = function (port, propertyInspectorUUID, registerEvent, info, inActionInfo) {
  actionInfo = inActionInfo;
  inspectorUUID = propertyInspectorUUID;
  socket = new WebSocket("ws://127.0.0.1:" + port);
  socket.onopen = () => {
    socket.send(JSON.stringify({ event: registerEvent, uuid: propertyInspectorUUID }));
    // The plugin pushes the list when the inspector appears, which can happen
    // before this socket exists. Asking makes the list independent of that.
    send({ type: "request-sessions" });
  };
  socket.onmessage = (message) => {
    let data;
    try { data = JSON.parse(message.data); } catch { return; }
    if (data.event === "sendToPropertyInspector" && data.payload && data.payload.type === "sessions") {
      sessions = Array.isArray(data.payload.sessions) ? data.payload.sessions : [];
      render();
    }
  };
};
nameInput.addEventListener("input", () => {
  const limited = nameInput.value.split("\n").slice(0, NAME_MAX_LINES).map((line) => line.slice(0, NAME_MAX_LINE_LENGTH)).join("\n");
  if (limited !== nameInput.value) nameInput.value = limited;
});
applyButton.addEventListener("click", () => send({ type: "set-slot-name", name: nameInput.value }));
</script>
</body>
</html>
